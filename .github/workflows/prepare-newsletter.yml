
name: Prepare Newsletter Draft

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-newsletter
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check RSS feed and prepare draft
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from html import escape

          FEED_URL = "https://mson.bearblog.dev/feed/"
          STATE_FILE = Path("data/processed_posts.json")
          DRAFT_DIR = Path("drafts")
          DRAFT_DIR.mkdir(parents=True, exist_ok=True)
          STATE_FILE.parent.mkdir(parents=True, exist_ok=True)

          request = urllib.request.Request(
              FEED_URL,
              headers={"User-Agent": "BearBlogNewsletterBot/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              feed = ET.fromstring(response.read())

          def text(element, name):
              node = element.find(name)
              return (node.text or "").strip() if node is not None else ""

          entries = feed.findall("./channel/item")
          if not entries:
              entries = feed.findall("{http://www.w3.org/2005/Atom}entry")

          def get_entry(item, name):
              value = text(item, name)
              if value:
                  return value
              node = item.find(f"{{http://www.w3.org/2005/Atom}}{name}")
              if node is not None:
                  if name == "link":
                      return node.attrib.get("href", "")
                  return (node.text or "").strip()
              return ""

          posts = []
          for item in entries:
              title = get_entry(item, "title")
              link = get_entry(item, "link")
              if not title or not link:
                  continue

              post_id = (
                  get_entry(item, "guid")
                  or get_entry(item, "id")
                  or link
              )
              posts.append({
                  "id": post_id,
                  "title": title,
                  "link": link,
                  "description": (
                      get_entry(item, "description")
                      or get_entry(item, "summary")
                  ),
                  "published": (
                      get_entry(item, "pubDate")
                      or get_entry(item, "published")
                      or get_entry(item, "updated")
                  )
              })

          if STATE_FILE.exists():
              state = json.loads(STATE_FILE.read_text(encoding="utf-8"))
          else:
              # First run establishes a baseline; it won't email old posts.
              state = {"processed": [p["id"] for p in posts]}

          processed = set(state.get("processed", []))
          new_posts = [p for p in posts if p["id"] not in processed]

          if not STATE_FILE.exists():
              STATE_FILE.write_text(
                  json.dumps(state, indent=2) + "\n", encoding="utf-8"
              )
              print(f"Baseline saved: {len(posts)} existing posts.")
          elif not new_posts:
              print("No new posts. Nothing to draft.")
          else:
              now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              lines = [
                  "# Newsletter draft — NOT SENT",
                  "",
                  f"Prepared: {now}",
                  "",
                  "> Review and edit this draft before sending. No email has been sent.",
                  "",
                  "## Suggested subject",
                  f"New on m.son: {new_posts[0]['title']}",
                  "",
                  "## Draft",
                  "",
                  "Hi there,",
                  "",
                  "I've published a new post on m.son:",
                  ""
              ]

              for post in new_posts:
                  lines += [
                      f"### {post['title']}",
                      "",
                      post["description"] or "Read the latest post on the blog.",
                      "",
                      f"Read the post: {post['link']}",
                      ""
                  ]

              lines += [
                  "Thanks for reading  ",
                  "ᓚᘏᗢ",
                  "",
                  "> Before sending: check the wording, links, recipient list, and unsubscribe option."
              ]

              stamp = datetime.now(timezone.utc).strftime("%Y%m%d-%H%M%S")
              draft_path = DRAFT_DIR / f"newsletter-{stamp}.md"
              draft_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

              state["processed"] = list(processed | {p["id"] for p in new_posts})
              STATE_FILE.write_text(
                  json.dumps(state, indent=2) + "\n", encoding="utf-8"
              )
              print(f"Draft prepared: {draft_path}")
              print(f"New posts included: {len(new_posts)}")
          PY

      - name: Commit draft and RSS tracking state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts data/processed_posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepare newsletter draft from new blog posts"
            git push
          else
            echo "No changes to save."
          fi
